<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>FORMULARIO</title>
       

    </head>
    <body>

         <img src="c:\Users\MOISESOLIVEIRAMARTIN\Downloads\WhatsApp Image 2026-11-25 at 19.49.36.jpeg" alt="Adriano Motos" class="logo">

         <h2>Faça seu cadastro e fique por dentro das novidades!</h2>

        <form id="formulario">

            
            <fieldset class="formulario">
                
                <legend> CADASTRO CLIENTE </legend>

                <label>Digite o seu nome:</label>
                <input type="text" id="nome" name="nome" placeholder="EX: Joao" required><br>

                <label>Contato do Cliente:</label>
                <input type="tel" id="telefone" name="telefone" required><br>

                <label> E-mail: </label>
                <input type="email" id="email" name="email" required><br>

                <label> (opcional) CPF: </label>
                <input type="text" id="cpf" name="CPF" inputmode="numeric" maxlength="14" placeholder="000.000.000-00" required><br>

                <label> Cidade: </label>
                <input type="text" id="Cidade" name="Cidade" list="lista-cidades" required>
                <datalist id="lista-cidades">
                    <option value="João Pessoa"></option>
                    <option value="Campina Grande"></option>
                    <option value="Cabedelo"></option>
                    <option value="Bayeux"></option>
                    <option value="Santa Rita"></option> 
                    <option value="Mamanguape"></option>       
                </datalist><br>

                <label> Endereço / Bairro: </label>
                <input type="text" id="endereco" name="endereco" placeholder="Avenida Coelho Lisboa 465 Jaguaribe"><br>

               
                <button type="submit" class="botao-form">Enviar</button>

            </fieldset>
        

        </form> 
        <script src="js.trabalho.js"></script> 
    </body>
</html>
