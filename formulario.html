<!DOCTYPE html>
<html>
    <head>
        <title>FORMULARIO</title>
    </head>
    <body>
        <form id="formulario">

            
            <fieldset class="formulario">
                
                <legend>Adriano Motos</legend>

                <label>Digite o seu nome:</label>
                <input type="text" id="nome" name="nome" placeholder="EX: Joao" required><br>
                <label>Contato do Cliente:</label>
                <input type="tel" id="telefone" name="telefone" required><br>
                <label> E-mail: </label>
                <input type="email" id="email" name="email" required><br>
                <label> (opcional) CPF: </label>
                <input type="text" id="cpf" name="CPF" inputmode="numeric" maxlength="14" placeholder="000.000.000.00"><br>
                <label> Cidade: </label>
                <input type="text" id="Cidade" name="Cidade" list="lista-cidades" required><br>
                <label> Tipo da Moto: </label>
                <input type="text" id="moto" name="moto" placeholder="EX: Honda CG 160 2022" required><br>

                <button type="submit" class="botao-form">Enviar</button>

            </fieldset>


        </form>  
    </body>
</html>
